<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Isometric Calm Ledger Block -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Top Face -->
    <path d="M0 -42 L40 -18 L0 6 L-40 -18 Z" fill="url(#cubeTop)" />
    
    <!-- Left Face -->
    <path d="M-40 -18 L0 6 L0 48 L-40 24 Z" fill="url(#cubeLeft)" />
    
    <!-- Right Face -->
    <path d="M0 6 L40 -18 L40 24 L0 48 Z" fill="url(#cubeRight)" />

    <!-- Ledger Lines / Details on Top Face -->
    <path d="M-20 -10 L0 2 L20 -10" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Accent Dots / Activity -->
    <circle cx="0" cy="26" r="3.5" fill="#ffffff" opacity="0.9" />
    <circle cx="20" cy="14" r="3" fill="#ffffff" opacity="0.75" />
    <circle cx="-20" cy="14" r="3" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
