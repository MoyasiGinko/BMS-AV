{% load i18n %}

<div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 xl:grid-cols-5 gap-3">
    {% for product in products %}
    <button type="button"
            @click="addToCart({
                id: {{ product.pk }},
                sku: '{{ product.sku|escapejs }}',
                name: '{{ product.name|escapejs }}',
                price: '{{ product.selling_price }}',
                tax_rate: '{{ product.tax_code.rate|default:'0.00' }}',
                stock_qty: {{ product.stock_qty|default:0 }},
                is_stock: {% if product.type == 'stock' %}true{% else %}false{% endif %}
            })"
            class="group relative flex flex-col justify-between p-3.5 bg-surface/80 hover:bg-indigo-50/50 dark:hover:bg-slate-800 border {% if product.type == 'stock' and product.stock_qty <= 0 %}border-rose-200 dark:border-rose-900/50 opacity-80{% else %}border-line/80 hover:border-indigo-400 dark:hover:border-indigo-500{% endif %} rounded-xl text-left shadow-xs hover:shadow-md transition-all duration-150 active:scale-95 cursor-pointer">
        <div>
            <div class="flex items-center justify-between text-[11px] font-mono text-muted mb-1 gap-1">
                <span class="truncate">{{ product.sku }}</span>
                {% if product.barcode %}
                <span class="text-[10px] bg-surface-2 px-1 rounded truncate">{{ product.barcode }}</span>
                {% endif %}
            </div>
            <h4 class="text-xs sm:text-sm font-semibold text-ink line-clamp-2 leading-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-400">
                {{ product.name }}
            </h4>
        </div>

        <div class="mt-2.5">
            {% if product.type == 'stock' %}
            <div class="mb-1.5 flex items-center">
                {% if product.stock_qty <= 0 %}
                <span class="inline-flex items-center gap-1 text-[10px] font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/60 px-1.5 py-0.5 rounded">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                    {% trans "Out of stock" %}
                </span>
                {% else %}
                <span class="inline-flex items-center gap-1 text-[10px] font-medium text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-1.5 py-0.5 rounded">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    {{ product.stock_qty|floatformat:0 }} {% trans "available" %}
                </span>
                {% endif %}
            </div>
            {% endif %}

            <div class="pt-2 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                <span class="text-sm sm:text-base font-bold font-mono text-indigo-600 dark:text-indigo-400">
                    ${{ product.selling_price }}
                </span>
                <span class="w-6 h-6 flex items-center justify-center rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </span>
            </div>
        </div>
    </button>
    {% empty %}
    <div class="col-span-full py-16 text-center text-muted">
        <svg class="w-12 h-12 mx-auto text-slate-300 dark:text-slate-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
        <p class="text-base font-medium">{% trans "No products found matching criteria." %}</p>
        <p class="text-xs text-slate-400 mt-1">{% trans "Try clearing your search term or select another category." %}</p>
    </div>
    {% endfor %}
</div>
