{% load i18n %}

<div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 xl:grid-cols-5 gap-3">
    {% for product in products %}
    <button type="button"
            @click="addToCart({
                id: {{ product.pk }},
                sku: '{{ product.sku|escapejs }}',
                name: '{{ product.name|escapejs }}',
                price: '{{ product.selling_price }}',
                tax_rate: '{{ product.tax_code.rate|default:'0.00' }}'
            })"
            class="group relative flex flex-col justify-between p-3.5 bg-white dark:bg-slate-800/80 hover:bg-indigo-50/50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700/80 hover:border-indigo-400 dark:hover:border-indigo-500 rounded-xl text-left shadow-xs hover:shadow-md transition-all duration-150 active:scale-95">
        <div>
            <div class="flex items-center justify-between text-[11px] font-mono text-slate-400 dark:text-slate-500 mb-1">
                <span class="truncate">{{ product.sku }}</span>
                {% if product.barcode %}
                <span class="text-[10px] bg-slate-100 dark:bg-slate-700 px-1 rounded">{{ product.barcode }}</span>
                {% endif %}
            </div>
            <h4 class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-white line-clamp-2 leading-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-400">
                {{ product.name }}
            </h4>
        </div>
        <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
            <span class="text-sm sm:text-base font-bold font-mono text-indigo-600 dark:text-indigo-400">
                ${{ product.selling_price }}
            </span>
            <span class="w-6 h-6 flex items-center justify-center rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </span>
        </div>
    </button>
    {% empty %}
    <div class="col-span-full py-16 text-center text-slate-500 dark:text-slate-400">
        <svg class="w-12 h-12 mx-auto text-slate-300 dark:text-slate-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
        <p class="text-base font-medium">{% trans "No products found matching criteria." %}</p>
        <p class="text-xs text-slate-400 mt-1">{% trans "Try clearing your search term or select another category." %}</p>
    </div>
    {% endfor %}
</div>
