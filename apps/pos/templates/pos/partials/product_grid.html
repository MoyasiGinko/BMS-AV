{% load i18n humanize %}

<div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-3.5">
    {% for product in products %}
    <button type="button"
            @click="addToCart({
                id: {{ product.pk }},
                sku: '{{ product.sku|escapejs }}',
                name: '{{ product.name|escapejs }}',
                price: '{{ product.selling_price }}',
                tax_rate: '{{ product.tax_code.rate|default:'0.00' }}',
                stock_qty: {{ product.stock_qty|default:0 }},
                is_stock: {% if product.type == 'stock' %}true{% else %}false{% endif %}
            })"
            class="group relative flex flex-col justify-between p-4 bg-[var(--surface-1)] hover:bg-[var(--surface-2)]/30 border {% if product.type == 'stock' and product.stock_qty <= 0 %}border-rose-200/70 dark:border-rose-900/40 opacity-75{% else %}border-[var(--border)] hover:border-[var(--brand-600)]/70{% endif %} rounded-2xl text-left shadow-xs hover:shadow-sm transition-all duration-150 active:scale-[0.98] cursor-pointer">
        <div>
            <!-- SKU & Barcode -->
            <div class="flex items-center justify-between text-2xs font-mono text-muted mb-1.5 gap-1">
                <span class="px-2 py-0.5 rounded-md bg-[var(--surface-2)]/70 border border-[var(--border)]/40 font-bold truncate">{{ product.sku }}</span>
                {% if product.barcode %}
                <span class="text-3xs text-muted/80 font-mono truncate">{{ product.barcode }}</span>
                {% endif %}
            </div>

            <!-- Product Title -->
            <h4 class="text-xs sm:text-sm font-bold text-ink line-clamp-2 leading-snug group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors mt-1">
                {{ product.name }}
            </h4>
        </div>

        <div class="mt-3">
            <!-- Stock Pill -->
            {% if product.type == 'stock' %}
            <div class="mb-2 flex items-center">
                {% if product.stock_qty <= 0 %}
                <span class="inline-flex items-center gap-1.5 text-2xs font-bold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/60 px-2 py-0.5 rounded-full border border-rose-200/50">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                    {% trans "Out of stock" %}
                </span>
                {% else %}
                <span class="inline-flex items-center gap-1.5 text-2xs font-bold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-200/50">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    {{ product.stock_qty|floatformat:0 }} {% trans "in stock" %}
                </span>
                {% endif %}
            </div>
            {% endif %}

            <!-- Price and Tactile Plus Action -->
            <div class="pt-2.5 border-t border-[var(--border)]/50 flex items-center justify-between">
                <span class="text-sm sm:text-base font-extrabold font-mono text-ink group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors">
                    ${{ product.selling_price|floatformat:2|intcomma }}
                </span>
                <span class="w-7 h-7 flex items-center justify-center rounded-xl bg-[var(--surface-2)] text-[var(--brand-600)] dark:text-[var(--brand-400)] group-hover:bg-[var(--brand-600)] group-hover:text-white transition-all shadow-2xs border border-[var(--border)]/60">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4" />
                    </svg>
                </span>
            </div>
        </div>
    </button>
    {% empty %}
    <div class="col-span-full py-16 text-center text-muted">
        <div class="max-w-xs mx-auto flex flex-col items-center justify-center text-center">
            <div class="w-14 h-14 rounded-2xl bg-[var(--surface-2)] flex items-center justify-center text-muted mb-4 shadow-inner border border-[var(--border)]/50">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
            </div>
            <h3 class="text-base font-bold text-ink">{% trans "No products found" %}</h3>
            <p class="text-xs text-muted mt-1 leading-relaxed">{% trans "No catalog items match your search term or selected category." %}</p>
        </div>
    </div>
    {% endfor %}
</div>
