{% load i18n humanize %}

<div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4 sm:gap-5">
    {% for product in products %}
    <button type="button"
            @click="addToCart({
                id: {{ product.pk }},
                sku: '{{ product.sku|escapejs }}',
                name: '{{ product.name|escapejs }}',
                price: '{{ product.selling_price }}',
                discount_percent: {{ product.discount_percent|default:'0.00' }},
                tax_rate: '{{ product.tax_code.rate|default:'0.00' }}',
                stock_qty: {{ product.stock_qty|default:0 }},
                is_stock: {% if product.type == 'stock' %}true{% else %}false{% endif %}
            })"
            class="pos-catalog-card group relative flex flex-col justify-between p-5 sm:p-6 bg-[var(--surface-1)] hover:bg-[var(--surface-2)]/30 {% if product.type == 'stock' and product.stock_qty <= 0 %}opacity-75{% endif %} rounded-2xl text-left transition-all duration-150 active:scale-[0.98] cursor-pointer min-h-[190px]">
        <div>
            <!-- SKU & Discount Tag Label (in place of barcode number) -->
            <div class="flex items-center justify-between text-xs font-mono text-muted mb-2.5 gap-2">
                <span class="px-2.5 py-0.5 rounded-lg bg-[var(--surface-2)]/70 border border-[var(--border)]/40 font-bold tracking-tight truncate">{{ product.sku }}</span>
                {% if product.discount_percent > 0 %}
                <span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-amber-100 text-amber-900 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300/60 shadow-2xs shrink-0">
                    {{ product.discount_percent|floatformat:0 }}% OFF
                </span>
                {% endif %}
            </div>

            <!-- Product Title -->
            <h4 class="text-sm sm:text-base lg:text-lg font-bold text-ink line-clamp-2 leading-snug group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors mt-1">
                {{ product.name }}
            </h4>
        </div>

        <div class="mt-4 sm:mt-5">
            <!-- Stock Pill -->
            {% if product.type == 'stock' %}
            <div class="mb-3 flex items-center">
                {% if product.stock_qty <= 0 %}
                <span class="pos-stock-out inline-flex items-center gap-1.5 text-xs font-bold text-rose-800 bg-rose-100/90 px-2.5 py-0.5 rounded-full border border-rose-300/60">
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    {% trans "Out of stock" %}
                </span>
                {% else %}
                <span class="pos-stock-in inline-flex items-center gap-1.5 text-xs font-bold text-emerald-800 bg-emerald-100/90 px-2.5 py-0.5 rounded-full border border-emerald-300/60">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    {{ product.stock_qty|floatformat:0 }} {% trans "in stock" %}
                </span>
                {% endif %}
            </div>
            {% endif %}

            <!-- Price and Tactile Plus Action -->
            <div class="pt-3 border-t border-[var(--border)]/50 flex items-center justify-between gap-2">
                <div class="flex flex-col min-w-0">
                    {% if product.discount_percent > 0 %}
                    <span class="text-lg sm:text-xl lg:text-2xl font-black font-mono text-ink group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors leading-tight">
                        ${{ product.effective_price|floatformat:2|intcomma }}
                    </span>
                    <span class="text-xs sm:text-sm font-mono text-muted line-through font-semibold mt-0.5">
                        ${{ product.selling_price|floatformat:2|intcomma }}
                    </span>
                    {% else %}
                    <span class="text-lg sm:text-xl lg:text-2xl font-black font-mono text-ink group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors leading-tight">
                        ${{ product.selling_price|floatformat:2|intcomma }}
                    </span>
                    {% endif %}
                </div>
                <span class="w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-xl bg-[var(--surface-2)] text-[var(--brand-600)] dark:text-[var(--brand-400)] group-hover:bg-[var(--brand-600)] group-hover:text-white transition-all shadow-2xs border border-[var(--border)]/60 shrink-0">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M12 4v16m8-8H4" />
                    </svg>
                </span>
            </div>
        </div>
    </button>
    {% empty %}
    <div class="col-span-full py-20 text-center text-muted">
        <div class="max-w-sm mx-auto flex flex-col items-center justify-center text-center">
            <div class="w-16 h-16 rounded-2xl bg-[var(--surface-2)] flex items-center justify-center text-muted mb-4 shadow-inner border border-[var(--border)]/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
            </div>
            <h3 class="text-lg font-bold text-ink">{% trans "No products found" %}</h3>
            <p class="text-sm text-muted mt-1 leading-relaxed">{% trans "No catalog items match your search term or selected category." %}</p>
        </div>
    </div>
    {% endfor %}
</div>
