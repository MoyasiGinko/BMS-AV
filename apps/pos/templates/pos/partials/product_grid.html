{% load i18n humanize money_tags %}

<style>
    #product-grid {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 0.875rem;
    }
    @media (min-width: 480px) {
        #product-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
    @media (min-width: 900px) {
        #product-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
        }
    }
    @media (min-width: 1950px) {
        #product-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
    }
    .pos-catalog-card {
        aspect-ratio: auto !important;
        min-height: 320px !important;
        height: auto !important;
    }
    .pos-card-thumb {
        height: 155px !important;
        width: 100% !important;
        display: flex !important;
    }
    @media (max-width: 639px) {
        .pos-catalog-card {
            aspect-ratio: auto !important;
            min-height: 305px !important;
        }
        .pos-card-thumb {
            height: 140px !important;
        }
    }
</style>

<div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3.5 sm:gap-4">
    {% for product in products %}
    <button type="button"
            @click="addToCart({
                id: {{ product.pk }},
                sku: '{{ product.sku|escapejs }}',
                name: '{{ product.name|escapejs }}',
                price: '{{ product.selling_price }}',
                discount_percent: {{ product.discount_percent|default:'0.00' }},
                tax_rate: '{{ product.tax_code.rate|default:'0.00' }}',
                stock_qty: {{ product.stock_qty|default:0 }},
                is_stock: {% if product.type == 'stock' %}true{% else %}false{% endif %}
            })"
            class="pos-catalog-card group relative flex flex-col justify-between p-3.5 sm:p-4 bg-[var(--surface-1)] hover:bg-[var(--surface-2)]/30 rounded-2xl text-left transition-all duration-150 active:scale-[0.98] cursor-pointer min-h-[315px]">
        <div>
            <!-- Image / Placeholder at the very top -->
            {% if product.primary_image %}
            <div class="pos-card-thumb mb-2.5 w-full rounded-xl overflow-hidden bg-[var(--surface-2)] border border-[var(--border)]/40 flex items-center justify-center">
                <img src="{{ product.primary_image.image.url }}" alt="{{ product.name }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200" />
            </div>
            {% else %}
            <div class="pos-card-thumb mb-2.5 w-full rounded-xl overflow-hidden bg-[var(--surface-2)]/50 border border-[var(--border)]/40 flex flex-col items-center justify-center text-muted group-hover:bg-[var(--surface-2)]/80 transition-colors">
                <div class="w-10 h-10 rounded-xl bg-[var(--surface-1)] border border-[var(--border)]/50 flex items-center justify-center shadow-2xs mb-1.5">
                    <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <span class="text-[10px] font-bold tracking-wider uppercase text-muted/70">{{ product.name|slice:":2" }}</span>
            </div>
            {% endif %}

            <!-- Product Title -->
            <h4 class="text-sm sm:text-base font-bold text-ink line-clamp-2 leading-snug group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors min-h-[2.5rem]">
                {{ product.name }}
            </h4>

            <!-- SKU (left) & Stock Count (right) in the same row -->
            <div class="mt-2 flex items-center justify-between text-xs gap-1.5 h-6">
                <span class="px-2 py-0.5 rounded-lg bg-[var(--surface-2)]/80 text-muted border border-[var(--border)]/50 font-mono font-bold tracking-tight truncate max-w-[55%]">
                    {{ product.sku }}
                </span>
                {% if product.type == 'stock' %}
                    {% if product.stock_qty <= 0 %}
                    <span class="pos-stock-out inline-flex items-center gap-1 text-[11px] font-bold text-white bg-rose-600 px-2 py-0.5 rounded-full shadow-2xs shrink-0">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-200"></span>
                        {% trans "Out of stock" %}
                    </span>
                    {% else %}
                    <span class="pos-stock-in inline-flex items-center gap-1 text-[11px] font-bold text-white bg-emerald-600 px-2 py-0.5 rounded-full shadow-2xs shrink-0">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-200"></span>
                        {{ product.stock_qty|floatformat:0 }} {% trans "in stock" %}
                    </span>
                    {% endif %}
                {% endif %}
            </div>
        </div>

        <!-- Price and Tactile Plus Action (with Discount Tag clipped with price) -->
        <div class="pt-2.5 border-t border-[var(--border)]/60 flex items-center justify-between gap-2 mt-3">
            <div class="flex flex-col min-w-0 justify-center">
                {% if product.discount_percent > 0 %}
                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="pos-price-val text-base sm:text-lg lg:text-xl font-black font-mono text-ink group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors leading-tight">
                        {{ product.effective_price|money:request.organization.currency }}
                    </span>
                    <span class="px-1.5 py-0.5 rounded-md text-[10px] font-black bg-amber-600 text-white shadow-2xs shrink-0 tracking-tight">
                        {{ product.discount_percent|floatformat:0 }}% OFF
                    </span>
                </div>
                <span class="text-xs sm:text-sm font-mono text-muted line-through font-semibold mt-0.5">
                    {{ product.selling_price|money:request.organization.currency }}
                </span>
                {% else %}
                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="pos-price-val text-base sm:text-lg lg:text-xl font-black font-mono text-ink group-hover:text-[var(--brand-600)] dark:group-hover:text-[var(--brand-400)] transition-colors leading-tight">
                        {{ product.selling_price|money:request.organization.currency }}
                    </span>
                </div>
                <span class="text-xs sm:text-sm font-mono mt-0.5 invisible select-none" aria-hidden="true">
                    &nbsp;
                </span>
                {% endif %}
            </div>
            <span class="pos-plus-btn w-8.5 h-8.5 sm:w-9 sm:h-9 flex items-center justify-center rounded-xl bg-[var(--surface-2)] text-[var(--brand-600)] dark:text-[var(--brand-400)] group-hover:bg-[var(--brand-600)] group-hover:text-white transition-all shadow-2xs border border-[var(--border)] shrink-0 font-bold">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
            </span>
        </div>
    </button>
    {% empty %}
    <div class="col-span-full py-20 text-center text-muted">
        <div class="max-w-sm mx-auto flex flex-col items-center justify-center text-center">
            <div class="w-16 h-16 rounded-2xl bg-[var(--surface-2)] flex items-center justify-center text-muted mb-4 shadow-inner border border-[var(--border)]/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
            </div>
            <h3 class="text-lg font-bold text-ink">{% trans "No products found" %}</h3>
            <p class="text-sm text-muted mt-1 leading-relaxed">{% trans "No catalog items match your search term or selected category." %}</p>
        </div>
    </div>
    {% endfor %}
</div>
