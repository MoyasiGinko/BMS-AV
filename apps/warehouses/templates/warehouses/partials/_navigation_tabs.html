{% load i18n %}
<div class="flex items-center gap-2 border-b border-[var(--border)] pb-3 overflow-x-auto no-scrollbar" aria-label="Warehouses Navigation Tabs">
  <!-- Warehouses -->
  <a
    href="{% url 'warehouses:list' %}"
    class="inline-flex items-center gap-2 px-4 py-2 text-sm rounded-xl transition-colors whitespace-nowrap {% if active_tab == 'warehouses' %}bg-[var(--brand-50)] text-[var(--brand-700)] font-bold shadow-xs{% else %}text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] font-medium{% endif %}"
  >
    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
    </svg>
    {% trans "Warehouses" %}
  </a>

  <!-- Branches -->
  <a
    href="{% url 'warehouses:branch_list' %}"
    class="inline-flex items-center gap-2 px-4 py-2 text-sm rounded-xl transition-colors whitespace-nowrap {% if active_tab == 'branches' %}bg-[var(--brand-50)] text-[var(--brand-700)] font-bold shadow-xs{% else %}text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] font-medium{% endif %}"
  >
    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    {% trans "Branches" %}
  </a>

  <!-- Locations & Bins -->
  <a
    href="{% url 'warehouses:location_list' %}"
    class="inline-flex items-center gap-2 px-4 py-2 text-sm rounded-xl transition-colors whitespace-nowrap {% if active_tab == 'locations' %}bg-[var(--brand-50)] text-[var(--brand-700)] font-bold shadow-xs{% else %}text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] font-medium{% endif %}"
  >
    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
    </svg>
    {% trans "Locations & Bins" %}
  </a>

  <!-- Supply Routes -->
  <a
    href="{% url 'warehouses:route_list' %}"
    class="inline-flex items-center gap-2 px-4 py-2 text-sm rounded-xl transition-colors whitespace-nowrap {% if active_tab == 'routes' %}bg-[var(--brand-50)] text-[var(--brand-700)] font-bold shadow-xs{% else %}text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] font-medium{% endif %}"
  >
    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
    </svg>
    {% trans "Supply Routes" %}
  </a>

  <!-- Transfers -->
  <a
    href="{% url 'warehouses:transfer_list' %}"
    class="inline-flex items-center gap-2 px-4 py-2 text-sm rounded-xl transition-colors whitespace-nowrap {% if active_tab == 'transfers' %}bg-[var(--brand-50)] text-[var(--brand-700)] font-bold shadow-xs{% else %}text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] font-medium{% endif %}"
  >
    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
    </svg>
    {% trans "Transfers" %}
  </a>

  <!-- Movement Ledger -->
  <a
    href="{% url 'warehouses:movement_list' %}"
    class="inline-flex items-center gap-2 px-4 py-2 text-sm rounded-xl transition-colors whitespace-nowrap {% if active_tab == 'movements' %}bg-[var(--brand-50)] text-[var(--brand-700)] font-bold shadow-xs{% else %}text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] font-medium{% endif %}"
  >
    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
    </svg>
    {% trans "Movement Ledger" %}
  </a>
</div>
