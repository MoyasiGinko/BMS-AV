{% load i18n %}
<div class="overflow-x-auto no-scrollbar py-1">
    <nav class="neu-nav-track inline-flex items-center p-1.5 bg-[var(--surface-2)]/60 rounded-2xl border border-[var(--border)]/50 shadow-inner gap-1" aria-label="Purchasing Navigation Tabs">
        <!-- Suppliers & Vendors -->
        <a href="{% url 'purchasing:supplier_list' %}"
           class="neu-nav-tab {% if active_tab == 'suppliers' %}neu-nav-tab-active bg-[var(--surface-1)] text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold shadow-xs border border-[var(--border)]/70{% else %}text-muted hover:text-ink hover:bg-[var(--surface-1)]/50 font-medium border border-transparent{% endif %} whitespace-nowrap px-3.5 py-2 rounded-xl text-sm flex items-center gap-2 transition-all">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            {% trans "Suppliers & Vendors" %}

        <!-- Purchase Orders -->
        <a href="{% url 'purchasing:purchase_order_list' %}"
           class="neu-nav-tab {% if active_tab == 'orders' %}neu-nav-tab-active bg-[var(--surface-1)] text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold shadow-xs border border-[var(--border)]/70{% else %}text-muted hover:text-ink hover:bg-[var(--surface-1)]/50 font-medium border border-transparent{% endif %} whitespace-nowrap px-3.5 py-2 rounded-xl text-sm flex items-center gap-2 transition-all">

            </svg>
            {% trans "Purchase Orders" %}
        </a>
        <!-- Goods Receipts (GRN) -->
        <a href="{% url 'purchasing:goods_receipt_list' %}"
           class="neu-nav-tab {% if active_tab == 'receipts' %}neu-nav-tab-active bg-[var(--surface-1)] text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold shadow-xs border border-[var(--border)]/70{% else %}text-muted hover:text-ink hover:bg-[var(--surface-1)]/50 font-medium border border-transparent{% endif %} whitespace-nowrap px-3.5 py-2 rounded-xl text-sm flex items-center gap-2 transition-all">

            </svg>

        <a href="{% url 'purchasing:supplier_bill_list' %}"
           class="neu-nav-tab {% if active_tab == 'bills' %}neu-nav-tab-active bg-[var(--surface-1)] text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold shadow-xs border border-[var(--border)]/70{% else %}text-muted hover:text-ink hover:bg-[var(--surface-1)]/50 font-medium border border-transparent{% endif %} whitespace-nowrap px-3.5 py-2 rounded-xl text-sm flex items-center gap-2 transition-all">

        </a>
        <!-- Disbursements / Payments -->

           class="neu-nav-tab {% if active_tab == 'payments' %}neu-nav-tab-active bg-[var(--surface-1)] text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold shadow-xs border border-[var(--border)]/70{% else %}text-muted hover:text-ink hover:bg-[var(--surface-1)]/50 font-medium border border-transparent{% endif %} whitespace-nowrap px-3.5 py-2 rounded-xl text-sm flex items-center gap-2 transition-all">

           class="neu-nav-tab {% if active_tab == 'returns' %}neu-nav-tab-active bg-[var(--surface-1)] text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold shadow-xs border border-[var(--border)]/70{% else %}text-muted hover:text-ink hover:bg-[var(--surface-1)]/50 font-medium border border-transparent{% endif %} whitespace-nowrap px-3.5 py-2 rounded-xl text-sm flex items-center gap-2 transition-all">

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 15v-1a4 4 0 00-4-4H4m0 0l4-4m-4 4l4 4m6 4v1a3 3 0 003 3h5a3 3 0 003-3V7a3 3 0 00-3-3h-5a3 3 0 00-3 3v1" />
