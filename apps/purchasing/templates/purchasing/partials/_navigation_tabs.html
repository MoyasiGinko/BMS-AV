{% load i18n %}
<div class="overflow-x-auto no-scrollbar border-b border-line/40 dark:border-white/10 pb-px">
    <nav class="flex items-center gap-6 text-sm" aria-label="Purchasing Navigation Tabs">
        <!-- Suppliers & Vendors -->
        <a href="{% url 'purchasing:supplier_list' %}"
           class="{% if active_tab == 'suppliers' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            {% trans "Suppliers & Vendors" %}
        </a>
        <!-- Purchase Orders -->
        <a href="{% url 'purchasing:purchase_order_list' %}"
           class="{% if active_tab == 'orders' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            {% trans "Purchase Orders" %}
        </a>
        <!-- Goods Receipts (GRN) -->
        <a href="{% url 'purchasing:goods_receipt_list' %}"
           class="{% if active_tab == 'receipts' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            {% trans "Goods Receipts (GRN)" %}
        </a>
        <!-- Vendor Bills -->
        <a href="{% url 'purchasing:supplier_bill_list' %}"
           class="{% if active_tab == 'bills' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" />
            </svg>
            {% trans "Vendor Bills" %}
        </a>
        <!-- Disbursements / Payments -->
        <a href="{% url 'purchasing:supplier_payment_list' %}"
           class="{% if active_tab == 'payments' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            {% trans "Payments & Disbursements" %}
        </a>
        <!-- Purchase Returns -->
        <a href="{% url 'purchasing:purchase_return_list' %}"
           class="{% if active_tab == 'returns' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 15v-1a4 4 0 00-4-4H4m0 0l4-4m-4 4l4 4m6 4v1a3 3 0 003 3h5a3 3 0 003-3V7a3 3 0 00-3-3h-5a3 3 0 00-3 3v1" />
            </svg>
            {% trans "Purchase Returns" %}
        </a>
    </nav>
</div>
