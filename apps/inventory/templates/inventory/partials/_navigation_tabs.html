{% load i18n %}
<div class="w-full sticky top-0 z-30 bg-[var(--bg)] px-4 sm:px-6 lg:px-8 py-2.5 sticky-header-tabs transition-all">
  <div class="pos-capsule wh-header-tabs-capsule inv-header-tabs-capsule px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-2xl flex items-center gap-3 w-full">
    <!-- Left Aligned Navigation Tabs -->
    <div class="flex items-center min-w-0 flex-1">
      <nav class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 text-left" aria-label="{% trans 'Inventory Navigation Tabs' %}">
        <!-- Stock Levels -->
        <a
          href="{% url 'inventory:stock_level_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'stock_levels' or active_tab == 'levels' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'stock_levels' or active_tab == 'levels' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          <span>{% trans "Stock Levels" %}</span>
        </a>

        <!-- Add Stock (Branch Requisition) -->
        <a
          href="{% url 'inventory:add_stock' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'add_stock' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'add_stock' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          <span>{% trans "Add Stock" %}</span>
        </a>

        <!-- Stock Requests -->
        <a
          href="{% url 'inventory:stock_request_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'requests' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'requests' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          <span>{% trans "Stock Requests" %}</span>
        </a>

        <!-- Stock Ledger (Movements) -->
        <a
          href="{% url 'inventory:movement_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'ledger' or active_tab == 'movements' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'ledger' or active_tab == 'movements' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          <span>{% trans "Stock Ledger" %}</span>
        </a>

        <!-- Transfers -->
        <a
          href="{% url 'inventory:transfer_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'transfers' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'transfers' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
          </svg>
          <span>{% trans "Transfers" %}</span>
        </a>

        <!-- Counts & Audits -->
        <a
          href="{% url 'inventory:count_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'counts' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'counts' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>{% trans "Counts & Audits" %}</span>
        </a>

        <!-- Adjustments -->
        <a
          href="{% url 'inventory:adjustment_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'adjustments' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'adjustments' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
          <span>{% trans "Adjustments" %}</span>
        </a>

        <!-- Batches & Serials -->
        <a
          href="{% url 'inventory:batch_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'batches' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'batches' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          <span>{% trans "Batches" %}</span>
        </a>

        <!-- Reorder -->
        <a
          href="{% url 'inventory:reorder_suggestions' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'reorder' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'reorder' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>{% trans "Reorder" %}</span>
        </a>
      </nav>
    </div>
  </div>
</div>
