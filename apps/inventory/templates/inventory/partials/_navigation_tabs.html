{% load i18n %}
<div class="w-full sticky top-0 z-30 bg-[var(--bg)] px-4 sm:px-6 lg:px-8 py-2.5 sticky-header-tabs transition-all">
  <div class="pos-capsule wh-header-tabs-capsule inv-header-tabs-capsule px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-2xl flex items-center gap-3 w-full">
    <!-- Left Aligned Navigation Tabs -->
    <div class="flex items-center min-w-0 flex-1">
      <nav class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 text-left" aria-label="{% trans 'Inventory Navigation Tabs' %}">
        <!-- Dashboard -->
        <a
          href="{% url 'inventory:inventory_dashboard' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'dashboard' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'dashboard' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/>
          </svg>
          <span>{% trans "Dashboard" %}</span>
        </a>

        <!-- Inventory (Stock Levels) -->
        <a
          href="{% url 'inventory:stock_level_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'inventory' or active_tab == 'stock_levels' or active_tab == 'levels' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'inventory' or active_tab == 'stock_levels' or active_tab == 'levels' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          <span>{% trans "Inventory" %}</span>
        </a>

        <!-- Stock Request (Add Stock, Return & Replacement) -->
        <a
          href="{% url 'inventory:add_stock' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'add_stock' or active_tab == 'stock_request' or active_tab == 'request_create' or active_tab == 'return_stock' or active_tab == 'returns' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'add_stock' or active_tab == 'stock_request' or active_tab == 'request_create' or active_tab == 'return_stock' or active_tab == 'returns' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          <span>{% trans "Stock Request" %}</span>
        </a>

        <!-- Request List -->
        <a
          href="{% url 'inventory:stock_request_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'requests' or active_tab == 'request_list' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'requests' or active_tab == 'request_list' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          <span>{% trans "Request List" %}</span>
        </a>

        <!-- Stock Ledger (Movements) -->
        <a
          href="{% url 'inventory:movement_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'ledger' or active_tab == 'movements' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'ledger' or active_tab == 'movements' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          <span>{% trans "Stock Ledger" %}</span>
        </a>

        <!-- Counts & Audits -->
        <a
          href="{% url 'inventory:count_list' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'counts' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'counts' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>{% trans "Counts & Audits" %}</span>
        </a>

        <!-- Reorder -->
        <a
          href="{% url 'inventory:reorder_suggestions' %}"
          class="inv-nav-pill flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border text-xs sm:text-sm transition-all shrink-0 {% if active_tab == 'reorder' %}inv-nav-pill-active border-indigo-500/50 bg-indigo-600 text-white shadow-sm font-bold{% else %}border-[var(--border)]/60 bg-[var(--surface-1)] text-ink hover:text-indigo-600 font-semibold shadow-2xs{% endif %}"
        >
          <svg class="w-4 h-4 shrink-0 {% if active_tab == 'reorder' %}text-white{% else %}text-muted{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>{% trans "Reorder" %}</span>
        </a>
      </nav>
    </div>
  </div>
</div>
