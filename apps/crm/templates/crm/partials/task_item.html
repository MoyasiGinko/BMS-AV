{% load i18n %}
<div id="crm-task-{{ task.public_id }}" class="flex items-center justify-between p-3 bg-surface rounded-lg border border-line">
    <div class="flex items-center space-x-3">
        {% if task.status != 'completed' %}
        <button hx-post="{% url 'crm:task_toggle_complete' public_id=task.public_id %}"
                hx-target="#crm-task-{{ task.public_id }}"
                hx-swap="outerHTML"
                class="w-5 h-5 rounded border border-slate-300 dark:border-slate-600 hover:border-emerald-500 hover:bg-emerald-50 flex items-center justify-center transition-colors">
        </button>
        {% else %}
        <span class="w-5 h-5 rounded bg-emerald-500 text-white flex items-center justify-center text-xs">✓</span>
        {% endif %}
        <div>
            <p class="text-sm font-medium {% if task.status == 'completed' %}line-through text-slate-400{% else %}text-ink{% endif %}">
                {{ task.title }}
            </p>
            {% if task.description %}
            <p class="text-xs text-muted">{{ task.description }}</p>
            {% endif %}
        </div>
    </div>
    <div class="flex items-center space-x-3 text-xs">
        {% if task.due_date %}
        <span class="{% if task.due_date < today and task.status != 'completed' %}text-rose-600 font-semibold{% else %}text-slate-400{% endif %}">
            {{ task.due_date|date:"M d, Y" }}
        </span>
        {% endif %}
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs capitalize
            {% if task.priority == 'urgent' %}bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300
            {% elif task.priority == 'high' %}bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300
            {% elif task.priority == 'medium' %}bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-300
            {% else %}bg-slate-100 text-slate-800 dark:bg-slate-700 dark:text-slate-300{% endif %}">
            {{ task.priority }}
        </span>
    </div>
</div>
