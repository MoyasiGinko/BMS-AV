{% load i18n %}
<div class="overflow-x-auto no-scrollbar border-b border-line/40 dark:border-white/10 pb-px">
    <nav class="flex items-center gap-6 text-sm" aria-label="Payroll Navigation Tabs">
        <!-- Payroll Runs -->
        <a href="{% url 'payroll:run_list' %}"
           class="{% if active_tab == 'runs' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
            {% trans "Payroll Runs" %}
        </a>
        <!-- Employee Salaries -->
        <a href="{% url 'payroll:assignment_list' %}"
           class="{% if active_tab == 'assignments' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            {% trans "Employee Salaries" %}
        </a>
        <!-- Salary Structures -->
        <a href="{% url 'payroll:structure_list' %}"
           class="{% if active_tab == 'structures' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            {% trans "Salary Structures" %}
        </a>
        <!-- Salary Components -->
        <a href="{% url 'payroll:component_list' %}"
           class="{% if active_tab == 'components' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
            {% trans "Salary Components" %}
        </a>
        <!-- My Payslips -->
        <a href="{% url 'payroll:my_payslips' %}"
           class="{% if active_tab == 'payslips' %}text-[var(--brand-600)] dark:text-[var(--brand-400)] font-bold border-b-2 border-[var(--brand-600)] dark:border-[var(--brand-400)]{% else %}text-muted hover:text-ink font-medium border-b-2 border-transparent{% endif %} pb-2.5 pt-1 flex items-center gap-2 whitespace-nowrap transition-colors">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
