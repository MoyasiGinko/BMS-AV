{% comment %}
Data Table Component
Usage:
  {% include "components/data_table.html" with headers=headers rows=rows %}
Or wrap table markup with .data-table-wrapper
{% endcomment %}
<div class="w-full overflow-x-auto border border-[var(--border)] rounded-[var(--radius-md)] bg-[var(--surface)] shadow-[var(--shadow-sm)] {{ class }}">
  <table class="w-full text-left border-collapse text-sm">
    {% if header %}
      <thead>
        <tr class="bg-[var(--surface-2)] border-b border-[var(--border)]">
          {{ header|safe }}
        </tr>
      </thead>
    {% endif %}
    <tbody class="divide-y divide-[var(--border)]">
      {{ body|safe }}
    </tbody>
  </table>
  {% if empty and not body %}
    <div class="p-8 text-center text-sm text-[var(--text-muted)]">
      {{ empty|safe }}
    </div>
  {% endif %}
</div>
