{% comment %}
Toast Notification Item Snippet
Usage: Can be used inline or dynamically inserted via HTMX OOB
{% endcomment %}
<div
  class="flex items-start gap-3 p-4 rounded-lg border shadow-lg transition-all duration-200
    {% if type == 'success' %}bg-[var(--success-bg)] text-[var(--success)] border-[var(--success-border)]
    {% elif type == 'warning' %}bg-[var(--warning-bg)] text-[var(--warning)] border-[var(--warning-border)]
    {% elif type == 'error' or type == 'danger' %}bg-[var(--danger-bg)] text-[var(--danger)] border-[var(--danger-border)]
    {% elif type == 'info' %}bg-[var(--info-bg)] text-[var(--info)] border-[var(--info-border)]
    {% else %}bg-[var(--surface)] text-[var(--text)] border-[var(--border)]{% endif %} {{ class }}"
  role="alert"
>
  <div class="shrink-0 mt-0.5">
    {% if type == 'success' %}
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    {% elif type == 'warning' %}
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    {% elif type == 'error' or type == 'danger' %}
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    {% else %}
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>
    {% endif %}
  </div>
  <div class="flex-1 text-sm font-medium leading-tight">
    {% firstof message text "" %}
  </div>
</div>
