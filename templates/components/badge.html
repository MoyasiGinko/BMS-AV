{% comment %}
Badge Component
Usage:
  {% include "components/badge.html" with variant="success" label="Active" %}
{% endcomment %}
<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium border select-none
  {% if variant == 'success' or variant == 'paid' or variant == 'active' %}
    bg-[var(--success-bg)] text-[var(--success)] border-[var(--success-border)]
  {% elif variant == 'warning' or variant == 'pending' %}
    bg-[var(--warning-bg)] text-[var(--warning)] border-[var(--warning-border)]
  {% elif variant == 'danger' or variant == 'overdue' %}
    bg-[var(--danger-bg)] text-[var(--danger)] border-[var(--danger-border)]
  {% elif variant == 'info' %}
    bg-[var(--info-bg)] text-[var(--info)] border-[var(--info-border)]
  {% else %}
    bg-[var(--surface-2)] text-[var(--text-muted)] border-[var(--border)]
  {% endif %}
  {{ class }}"
>
  {% if icon %}{% include "components/icon.html" with name=icon class="w-3 h-3 mr-1" %}{% endif %}
  {% firstof label text "" %}
</span>
