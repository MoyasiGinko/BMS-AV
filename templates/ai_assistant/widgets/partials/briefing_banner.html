{% load i18n %}
<div id="attention-briefing-banner"
     class="relative rounded-2xl border border-[var(--border)] border-l-4 border-l-[var(--brand-600)] bg-[var(--surface-2)]/60 p-4 shadow-2xs transition-all duration-200">
  
  <!-- Header Bar -->
  <div class="flex items-center justify-between pb-2.5 border-b border-[var(--border)]/70">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-lg bg-[var(--brand-600)] text-white flex items-center justify-center shrink-0 shadow-2xs">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <h4 class="text-xs font-bold uppercase tracking-wider text-[var(--text)]">
          {% trans "Executive Morning Briefing" %}
        </h4>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-3xs font-semibold bg-[var(--surface-1)] text-[var(--text-muted)] border border-[var(--border)]/70">
          {{ generated_at|default:"Live Digest" }}
        </span>
      </div>
    </div>
    
    <button type="button"
            hx-post="{% url 'ai:attention_briefing_dismiss' %}"
            hx-target="#attention-briefing-banner"
            hx-swap="outerHTML"
            title="{% trans 'Dismiss executive briefing' %}"
            class="text-[var(--text-muted)] hover:text-[var(--text)] p-1 rounded-lg hover:bg-[var(--surface-1)] transition-colors cursor-pointer">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- 3-Column Strip matching Bento Columns -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
    {% for line in briefing_lines %}
      {% if line.strip %}
        <div class="p-3 rounded-xl bg-[var(--surface-1)] border border-[var(--border)]/70 text-xs text-[var(--text)] flex items-start gap-2 shadow-2xs">
          <span class="w-4.5 h-4.5 rounded-md bg-[var(--brand-600)]/15 text-[var(--brand-600)] flex items-center justify-center shrink-0 font-bold text-3xs mt-0.5">•</span>
          <span class="font-medium leading-relaxed">{{ line|cut:"• "|cut:"* "|cut:"- " }}</span>
        </div>
      {% endif %}
    {% empty %}
      <div class="text-xs text-[var(--text-muted)] p-2 col-span-3">{{ briefing }}</div>
    {% endfor %}
  </div>

</div>
