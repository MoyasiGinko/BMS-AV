{% load i18n %}
<div id="attention-briefing-banner"
     class="h-full flex flex-col justify-between rounded-2xl border border-[var(--border)] bg-gradient-to-br from-[var(--surface-1)] to-[var(--surface-2)]/40 p-4.5 sm:p-5 shadow-xs transition-all duration-200 hover:shadow-md">
  
  <div>
    <!-- Bento Card Header (No Icon, Clear Title & Actions) -->
    <div class="flex items-center justify-between pb-3.5 border-b border-[var(--border)]/70">
      <div>
        <h4 class="text-base sm:text-lg font-bold text-[var(--text)] tracking-tight"
            aria-label="{% trans 'Executive Morning Briefing' %}">
          {% trans "Briefing" %}
        </h4>
        <span class="text-xs text-[var(--text-muted)] font-medium">
          {{ generated_at|default:"Today" }}
        </span>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Refresh Button -->
        <button type="button"
                hx-post="{% url 'ai:attention_briefing' %}"
                hx-target="#attention-briefing-container"
                title="{% trans 'Refresh' %}"
                class="w-7 h-7 flex items-center justify-center rounded-lg text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] transition-colors cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>

        <!-- Dismiss Button -->
        <button type="button"
                @click="hasBriefing = false"
                hx-post="{% url 'ai:attention_briefing_dismiss' %}"
                hx-target="#attention-briefing-container"
                hx-swap="innerHTML"
                title="{% trans 'Dismiss' %}"
                class="w-7 h-7 flex items-center justify-center rounded-lg text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] transition-colors cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Briefing Highlights -->
    <div class="mt-4 space-y-3.5">
      {% for line in briefing_lines %}
        {% if line.strip %}
          <div class="flex items-start gap-2.5 text-sm sm:text-[15px]">
            <span class="w-2 h-2 rounded-full bg-[var(--brand-600)] mt-2 shrink-0"></span>
            <p class="text-sm sm:text-[15px] text-[var(--text)] leading-relaxed font-medium">
              {{ line|cut:"• "|cut:"* "|cut:"- " }}
            </p>
          </div>
        {% endif %}
      {% empty %}
        <div class="text-sm text-[var(--text-muted)] p-3">
          {{ briefing }}
        </div>
      {% endfor %}
    </div>
  </div>

</div>
