{% load i18n %}
<div id="secret-panel-root" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-xs" x-data="{ showSecret: false, copied: false }">
    <div class="flex items-center justify-between mb-2">
        <div>
            <h3 class="text-xs font-semibold text-slate-900 dark:text-white uppercase tracking-wider">{% trans "Signing Secret" %}</h3>
            <p class="text-2xs text-slate-500 mt-0.5">{% trans "Used to compute and verify the X-Signature HMAC-SHA256 header on every webhook delivery." %}</p>
        </div>
        <form method="post" action="{% url 'integrations:webhook_endpoint_rotate_secret' endpoint.public_id %}" 
              hx-post="{% url 'integrations:webhook_endpoint_rotate_secret' endpoint.public_id %}" 
              hx-target="#secret-panel-root" 
              hx-swap="outerHTML" 
              hx-confirm="{% trans 'Are you sure you want to rotate the signing secret? External receivers using the old secret will fail signature verification until updated.' %}">
            {% csrf_token %}
            <button type="submit" class="px-2.5 py-1 text-2xs font-semibold text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-900/30 hover:bg-amber-100 dark:hover:bg-amber-900/50 rounded-lg border border-amber-200 dark:border-amber-800 transition-colors">
                {% trans "Rotate Secret" %}
            </button>
        </form>
    </div>

    <div class="flex items-center gap-2 mt-3">
        <div class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 font-mono text-xs select-all text-slate-900 dark:text-slate-100 flex items-center justify-between">
            <span x-show="showSecret">{{ endpoint.secret }}</span>
            <span x-show="!showSecret" class="tracking-widest text-slate-400">whsec_••••••••••••••••••••••••••••••••</span>
            <button type="button" @click="showSecret = !showSecret" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 ml-3">
                <span x-text="showSecret ? '{% trans "Hide" %}' : '{% trans "Reveal" %}'"></span>
            </button>
        </div>
        <button type="button" 
                @click="navigator.clipboard.writeText('{{ endpoint.secret }}'); copied = true; setTimeout(() => copied = false, 2000)" 
                class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-50 shadow-2xs">
            <span x-show="!copied">{% trans "Copy" %}</span>
            <span x-show="copied" class="text-emerald-600 font-bold">{% trans "Copied!" %}</span>
        </button>
    </div>
</div>
