{% load i18n %}
<div class="space-y-2">
  <div class="flex items-center space-x-2">
    <input
      type="text"
      readonly
      value="{{ new_secret }}"
      class="flex-1 font-mono text-xs bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-200 font-bold rounded-xl px-3 py-2"
    />
    <button
      type="button"
      onclick="navigator.clipboard.writeText('{{ new_secret }}'); alert('New secret copied!');"
      class="px-3 py-2 border border-transparent text-xs font-medium rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 transition"
    >
      {% trans "Copy" %}
    </button>
  </div>
  <p class="text-[11px] text-amber-600 dark:text-amber-400 font-medium">
    {% trans "Secret rotated successfully! Copy it now before leaving this page." %}
  </p>
</div>
