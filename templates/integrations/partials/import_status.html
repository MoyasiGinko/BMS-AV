{% load i18n %}
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-mono font-medium {% if job.status == 'completed' %}bg-emerald-50 border-emerald-200 text-emerald-700 dark:bg-emerald-950/40 dark:border-emerald-800 dark:text-emerald-300{% elif job.status == 'failed' %}bg-rose-50 border-rose-200 text-rose-700 dark:bg-rose-950/40 dark:border-rose-800 dark:text-rose-300{% else %}bg-amber-50 border-amber-200 text-amber-700 dark:bg-amber-950/40 dark:border-amber-800 dark:text-amber-300 animate-pulse{% endif %}">
    {% if job.status == 'validating' or job.status == 'committing' %}
    <svg class="animate-spin h-3.5 w-3.5 text-amber-600" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
    {% endif %}
    <span>{{ job.get_status_display }}</span>
</div>
