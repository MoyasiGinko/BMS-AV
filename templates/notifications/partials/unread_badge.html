{% if unread_count and unread_count > 0 %}
  <span
    id="notification-badge"
    class="absolute -top-1 -right-1 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-[var(--danger)] px-1 text-[10px] font-bold text-white shadow-xs animate-pulse"
    aria-label="{{ unread_count }} unread notifications"
  >
    {{ unread_count|default:"0" }}
  </span>
{% else %}
  <span id="notification-badge" class="hidden"></span>
{% endif %}
