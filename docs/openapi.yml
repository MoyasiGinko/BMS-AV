        precision:
          type: integer
          maximum: 32767
          minimum: 0
          title: Decimal precision
          description: Allowed decimal places for transaction quantities (0 for discrete
            pieces, 2-4 for weight/vol).
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    UnitRequest:
      type: object
      description: Serializer for Unit of Measure.
      properties:
        name:
          type: string
          minLength: 1
          title: Unit name
          maxLength: 64
        code:
          type: string
          minLength: 1
          title: Unit code
          maxLength: 16
        precision:
          type: integer
          maximum: 32767
          minimum: 0
          title: Decimal precision
          description: Allowed decimal places for transaction quantities (0 for discrete
            pieces, 2-4 for weight/vol).
        is_active:
          type: boolean
      required:
      - code
      - name
    UsageCounter:
