      - error_message
      - event_id
      - event_type
      - execution_time_ms
      - id
      - next_retry_at
      - payload
      - request_headers
      - response_body
      - response_headers
      - response_status_code
      - status
    WebhookDeliveryStatusEnum:
      enum:
      - pending
      - success
      - failed
      - retrying
