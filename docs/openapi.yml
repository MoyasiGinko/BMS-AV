        * `failed` - Failed
        * `skipped` - Skipped
    WebhookDelivery:
      type: object
      description: Log record representing an attempted HTTP event delivery.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        endpoint_id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          type: string
          readOnly: true
        event_id:
          type: string
          readOnly: true
        payload:
          readOnly: true
        request_headers:
          readOnly: true
        response_status_code:
          type: integer
          readOnly: true
          nullable: true
        response_headers:
          readOnly: true
        response_body:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        execution_time_ms:
          type: integer
          readOnly: true
          title: Execution time (ms)
        attempt:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WebhookDeliveryStatusEnum'
          readOnly: true
        next_retry_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
