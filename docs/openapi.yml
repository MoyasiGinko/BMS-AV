components:
  schemas:
    AbcTierSummary:
      type: object
      properties:
        tier:
          type: string
        tier_label:
          type: string
        product_count:
          type: integer
        product_share_pct:
          type: number
          format: double
        total_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        revenue_share_pct:
          type: number
          format: double
      required:
      - product_count
      - product_share_pct
      - revenue_share_pct
      - tier
      - tier_label
      - total_revenue
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          title: Account code
          maxLength: 32
        name:
          type: string
          title: Account name
          maxLength: 128
        type:
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          title: Account type
        parent:
          type: integer
          nullable: true
          title: Parent account
        parent_code:
          type: string
          readOnly: true
        currency:
          type: string
          title: Currency code
          maxLength: 3
        is_control:
          type: boolean
          title: Is control account
          description: System control account (e.g. AR, AP, Inventory) updated primarily
            via subledgers.
        is_active:
          type: boolean
        description:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - parent_code
      - public_id
      - type
      - updated_at
    AccountCreateRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        parent_id:
          type: integer
          nullable: true
        currency:
          type: string
          minLength: 1
          default: ''
          maxLength: 3
        is_control:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        description:
          type: string
          default: ''
          maxLength: 255
      required:
      - code
      - name
      - type
    AccountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          title: Account code
          maxLength: 32
        name:
          type: string
          minLength: 1
          title: Account name
          maxLength: 128
        type:
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          title: Account type
        parent:
          type: integer
          nullable: true
          title: Parent account
        currency:
          type: string
          title: Currency code
          maxLength: 3
        is_control:
          type: boolean
          title: Is control account
          description: System control account (e.g. AR, AP, Inventory) updated primarily
            via subledgers.
        is_active:
          type: boolean
        description:
          type: string
          maxLength: 255
      required:
      - code
      - name
      - type
    AccountTypeEnum:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      type: string
      description: |-
        * `asset` - Asset
        * `liability` - Liability
        * `equity` - Equity
        * `revenue` - Revenue
        * `expense` - Expense
    AdjustmentTypeEnum:
      enum:
      - debit
      - credit
      type: string
      description: |-
        * `debit` - debit
        * `credit` - credit
    AiActionConfirm:
      type: object
      description: Serializer for confirming a pending AI action.
      properties:
        message_id:
          type: string
          maxLength: 64
      required:
      - message_id
    AiActionConfirmRequest:
      type: object
      description: Serializer for confirming a pending AI action.
      properties:
        message_id:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - message_id
    AiAuditLog:
      type: object
      description: Serializer for AI execution audit logs.
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        model_name:
          type: string
          readOnly: true
        tool_name:
          type: string
          readOnly: true
        prompt_tokens:
          type: integer
          readOnly: true
        completion_tokens:
          type: integer
          readOnly: true
        latency_ms:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AiAuditLogStatusEnum'
          readOnly: true
        action_confirmed:
          type: boolean
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action_confirmed
      - completion_tokens
      - created_at
      - error_message
      - id
      - latency_ms
      - model_name
      - prompt_tokens
      - provider
      - public_id
      - status
      - tool_name
      - user_email
    AiAuditLogStatusEnum:
      enum:
      - success
      - error
      - permission_denied
      - quota_exceeded
      type: string
      description: |-
        * `success` - Success
        * `error` - Error
        * `permission_denied` - Permission Denied
        * `quota_exceeded` - Quota Exceeded
    AiConversation:
      type: object
      description: Serializer for AI conversations with message count.
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        messages_count:
          type: integer
          readOnly: true
        latest_message:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - latest_message
      - messages_count
      - public_id
      - updated_at
    AiConversationRequest:
      type: object
      description: Serializer for AI conversations with message count.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    AiMessage:
      type: object
      description: Serializer for single conversation messages.
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        tool_calls:
          readOnly: true
          description: List of tool calls generated by LLM
        tool_results:
          readOnly: true
          description: Execution results from tool registry handlers
        pending_action:
          readOnly: true
          description: Draft mutation action awaiting user review and confirmation
        is_action_confirmed:
          type: boolean
          readOnly: true
          title: Action confirmed
          description: Whether the pending action was confirmed and executed
        token_usage:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - is_action_confirmed
      - pending_action
      - public_id
      - role
      - token_usage
      - tool_calls
      - tool_results
    AiPromptRequestRequest:
      type: object
      description: Serializer for submitting a chat prompt.
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
        provider:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 128
      required:
      - content
    ApiKey:
      type: object
      description: Public representation of an API key (never exposes raw secret or
        key hash).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Key name
          maxLength: 128
        prefix:
          type: string
          readOnly: true
          title: Key prefix
        scopes:
          title: Granted scopes
        ip_allowlist: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
          title: Expiration time
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Last used time
        last_used_ip:
          type: string
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
      - last_used_ip
      - name
      - prefix
      - revoked_at
      - updated_at
    ApiKeyCreateRequest:
      type: object
      description: Input payload for generating a new API key.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        scopes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
        ip_allowlist:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
    ApiKeyCreatedResponse:
      type: object
      description: Response containing created API key metadata along with one-time
        plain secret.
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKey'
        raw_key:
          type: string
          description: Plaintext secret token. Stored in hashed format; cannot be
            retrieved again.
      required:
      - api_key
      - raw_key
    ApiKeyRequest:
      type: object
      description: Public representation of an API key (never exposes raw secret or
        key hash).
      properties:
        name:
          type: string
          minLength: 1
          title: Key name
          maxLength: 128
        scopes:
          title: Granted scopes
        ip_allowlist: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
          title: Expiration time
      required:
      - name
    ApiKeyRotateRequest:
      type: object
      description: Input payload for rotating an API key.
      properties:
        grace_period_hours:
          type: integer
          maximum: 720
          minimum: 0
          default: 0
          description: Number of hours to keep old key active for migration. 0 means
            immediate revocation.
    ApprovalActionEnum:
      enum:
      - submitted
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `submitted` - Submitted
        * `approved` - Approved
        * `rejected` - Rejected
        * `cancelled` - Cancelled
    ApprovalDecisionRequest:
      type: object
      description: Serializer for approve and reject request actions.
      properties:
        notes:
          type: string
          default: ''
    ApprovalHistory:
      type: object
      description: Serializer for request audit timeline entries.
      properties:
        id:
          type: integer
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ApprovalActionEnum'
          readOnly: true
          title: Action taken
        actor:
          type: integer
          readOnly: true
          nullable: true
          title: Action actor
        actor_email:
          type: string
          format: email
          title: Email address
          readOnly: true
        notes:
          type: string
          readOnly: true
          title: Notes / reason
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - created_at
      - id
      - notes
    ApprovalRequest:
      type: object
      description: Serializer for approval requests.
      properties:
        id:
          type: integer
