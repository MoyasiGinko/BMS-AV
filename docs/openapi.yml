      description: |-
        * `pending` - Pending
        * `success` - Success
        * `failed` - Failed
        * `retrying` - Retrying
    WebhookEndpoint:
      type: object
      description: Full detail representation of a tenant webhook endpoint.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          title: Endpoint URL
          maxLength: 512
        description:
          type: string
          maxLength: 255
        events:
          title: Subscribed events
          description: List of subscribed event types or ['*'] for all events
        is_active:
          type: boolean
        consecutive_failures:
          type: integer
          readOnly: true
        disabled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        secret:
          type: string
          readOnly: true
      required:
      - consecutive_failures
      - created_at
      - disabled_at
      - id
      - secret
      - updated_at
      - url
    WebhookEndpointCreate:
      type: object
      description: Payload to register a new destination webhook endpoint.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          title: Endpoint URL
          maxLength: 512
        description:
          type: string
          maxLength: 255
        events:
          type: array
          items:
            type: string
            maxLength: 128
        is_active:
          type: boolean
        secret:
          type: string
          readOnly: true
      required:
      - id
      - secret
      - url
    WebhookEndpointCreateRequest:
      type: object
      description: Payload to register a new destination webhook endpoint.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          title: Endpoint URL
          maxLength: 512
        description:
          type: string
          maxLength: 255
        events:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        is_active:
          type: boolean
      required:
      - url
    WebhookEndpointRequest:
      type: object
      description: Full detail representation of a tenant webhook endpoint.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          title: Endpoint URL
          maxLength: 512
        description:
          type: string
          maxLength: 255
        events:
          title: Subscribed events
          description: List of subscribed event types or ['*'] for all events
        is_active:
          type: boolean
      required:
      - url
    ZapierSubscribeRequest:
      type: object
      description: Payload to register a Zapier REST hook subscription.
      properties:
        target_url:
          type: string
          format: uri
          minLength: 1
          description: Target URL for Zapier trigger deliveries
        event:
          type: string
          minLength: 1
