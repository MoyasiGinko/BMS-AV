        * `email` - email
        * `in_app` - in_app
    UserNotificationPreferenceItemRequest:
      type: object
      description: Personal notification preference for a single category and channel.
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 64
        channel:
          $ref: '#/components/schemas/UserNotificationPreferenceItemChannelEnum'
        is_enabled:
          type: boolean
