    get:
      operationId: sales_payments_list
      description: API endpoint for managing customer payments and allocations.
      summary: List customer payments
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: customer
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - bank_transfer
          - cash
          - check
          - credit_card
          - debit_card
          - online
          - other
        description: |-
          * `cash` - Cash
          * `bank_transfer` - Bank Transfer
          * `credit_card` - Credit Card
          * `debit_card` - Debit Card
          * `check` - Check / Cheque
          * `online` - Online Payment
          * `other` - Other
      - name: search
