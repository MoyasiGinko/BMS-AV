components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          title: Account code
          maxLength: 32
        name:
          type: string
          title: Account name
          maxLength: 128
        type:
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          title: Account type
        parent:
          type: integer
          nullable: true
          title: Parent account
        parent_code:
          type: string
          readOnly: true
        currency:
          type: string
          title: Currency code
          maxLength: 3
        is_control:
          type: boolean
          title: Is control account
          description: System control account (e.g. AR, AP, Inventory) updated primarily
            via subledgers.
        is_active:
          type: boolean
        description:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - parent_code
      - public_id
      - type
      - updated_at
    AccountCreateRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        parent_id:
          type: integer
          nullable: true
        currency:
          type: string
          minLength: 1
          default: ''
          maxLength: 3
        is_control:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        description:
          type: string
          default: ''
          maxLength: 255
      required:
      - code
      - name
      - type
    AccountRequest:
      type: object
      properties:
        code:
          type: string
