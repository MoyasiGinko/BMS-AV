      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        shift_number:
          type: string
          readOnly: true
        register:
          type: integer
          readOnly: true
        register_code:
          type: string
          readOnly: true
        register_name:
          type: string
          readOnly: true
        cashier:
          type: integer
          readOnly: true
        cashier_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/FiscalPeriodStatusEnum'
          readOnly: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        opening_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
          title: Opening Cash Float
        closing_cash_counted:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
          title: Counted Closing Cash
        expected_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
          title: Expected Cash in Drawer
        cash_variance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
          title: Cash Variance (Overage/Shortage)
        total_sales_amount:
          type: number
          format: double
          readOnly: true
        total_cash_sales:
          type: number
          format: double
          readOnly: true
        total_card_sales:
          type: number
          format: double
          readOnly: true
        total_other_sales:
          type: number
          format: double
          readOnly: true
        notes:
          type: string
          readOnly: true
          title: Shift Notes
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cash_variance
      - cashier
      - cashier_name
      - closed_at
      - closing_cash_counted
      - created_at
      - expected_cash
      - notes
      - opened_at
      - opening_cash
      - public_id
      - register
      - register_code
      - register_name
      - shift_number
      - status
      - total_card_sales
      - total_cash_sales
      - total_other_sales
      - total_sales_amount
    POSTenderInputRequest:
