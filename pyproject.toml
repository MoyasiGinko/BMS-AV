[project]
name = "business-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "django-filter>=24.1",
  "djangorestframework-simplejwt>=5.3",
  "django-oauth-toolkit>=3.0",
  "django-allauth>=65",
  "django-htmx>=1.17",
  "django-environ>=0.11",
  "django-storages>=1.14",
  "django-cors-headers>=4.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "whitenoise>=6.6",
  "gunicorn>=22",
  "cryptography>=42",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "sentry-sdk>=2.0",
  "django-waffle>=4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-django>=4.8", "pytest-cov>=5", "pytest-xdist>=3.5",
  "factory-boy>=3.3", "hypothesis>=6.100", "freezegun>=1.5",
  "ruff>=0.5", "mypy>=1.10", "django-stubs[compatible-mypy]>=5.0", "djangorestframework-stubs>=3.15",
  "import-linter>=2.0", "playwright>=1.44", "pytest-playwright>=0.5", "responses>=0.25",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations"]
[tool.ruff.lint]
select = ["E","F","I","B","UP","DJ","S","C4","SIM","PL","RUF"]
ignore = ["PLR0913","PLR2004","S101","RUF012","DJ001"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","PLR","B"]
"config/settings/*" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["migrations", "tests"]
[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
markers = ["ui: playwright UI smoke tests", "slow: slow tests"]
testpaths = ["tests", "apps"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py"]

# ---------- Architecture contracts (import-linter) ----------
[tool.importlinter]
root_packages = ["apps"]
include_external_packages = false

# Higher layers may import lower layers. Never the reverse. Siblings (|) are independent of each other.
[[tool.importlinter.contracts]]
name = "Module layering"
type = "layers"
layers = [
  "apps.reports | apps.ai_assistant | apps.automation | apps.integrations",
  "apps.pos | apps.payroll",
  "apps.sales | apps.purchasing | apps.hr",
  "apps.accounting | apps.inventory | apps.customers",
  "apps.catalog",
  "apps.billing | apps.tenancy | apps.accounts",
  "apps.core",
]
ignore_imports = [
  # api/ subpackages and tests may use core; nothing else is exempt without an ADR
]

[[tool.importlinter.contracts]]
name = "Services/selectors never import views or serializers"
type = "forbidden"
source_modules = ["apps.*.services", "apps.*.selectors"]
forbidden_modules = ["apps.*.views", "apps.*.api", "rest_framework"]
allow_indirect_imports = true
