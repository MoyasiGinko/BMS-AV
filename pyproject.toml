[project]
name = "business-os"
version = "0.1.0"
requires-python = ">=3.13"
# Versions verified against PyPI on 2026-10-07. See docs/STACK.md. Do not downgrade without an ADR.
dependencies = [
  # --- core framework ---
  "Django>=6.1.2,<6.2",
  "psycopg[binary,pool]>=3.3.6",
  "django-environ>=0.14.0",
  "whitenoise>=6.12.0",
  "gunicorn>=26.2.0",
  # --- API ---
  "djangorestframework>=3.18.3",
  "drf-spectacular>=0.30.0",
  "django-filter>=26.2",
  "djangorestframework-simplejwt>=5.5.1",
  "django-oauth-toolkit>=3.4.1",
  "django-cors-headers>=4.9.0",
  # --- auth & security ---
  "django-allauth[mfa]>=65.19.7",
  "django-axes>=8.3.1",
  "cryptography>=50.0.2",
  # --- UI helpers ---
  "django-htmx>=1.29.0",
  "django-tailwind-cli>=4.8.1",
  # --- async work & cache ---
  "celery[redis]>=5.6.3",
  "redis>=8.1.0",
  # --- domain helpers ---
  "django-treebeard>=7.0.2",
  "django-countries>=9.1.0",
  "django-phonenumber-field[phonenumbers]>=8.5.0",
  "babel>=2.18.0",
  "pydantic>=2.13.5",
  "orjson>=3.12.0",
  "django-waffle>=5.0.0",
  # --- documents & files ---
  "openpyxl>=3.1.5",
  "reportlab>=5.0.1",
  "pillow>=12.3.0",
  "qrcode>=8.2",
  "django-storages[s3]>=1.14.6",
  # --- ops ---
  "sentry-sdk>=2.71.0",
  "structlog>=26.1.0",
  "prometheus-client>=0.26.0",
  "django-health-check>=4.8.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
ai = ["anthropic>=1.11.0", "openai>=3.26.0", "google-genai>=2.28.0"]
dev = [
  "pytest>=9.1.1", "pytest-django>=4.14.0", "pytest-cov>=7.1.0", "pytest-xdist>=3.8.0", "pytest-randomly>=5.0.0",
  "factory-boy>=3.3.3", "hypothesis>=6.168.5", "freezegun>=1.5.5", "responses>=0.26.3",
  "ruff>=0.16.10", "mypy>=2.4.0", "django-stubs[compatible-mypy]>=6.1.2", "djangorestframework-stubs>=3.18.1", "celery-types>=0.26.0",
  "import-linter>=2.15", "pip-audit>=2.10.1", "pre-commit>=4.6.2",
  "playwright>=1.63.0", "pytest-playwright>=0.9.0",
  "django-debug-toolbar>=8.0.0", "django-extensions>=4.1",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["migrations", ".agent", ".agents", "docs"]  # ADR 0003
[tool.ruff.lint]
select = ["E","F","I","B","UP","DJ","S","C4","SIM","PL","RUF"]
ignore = ["PLR0913","PLR2004","S101","RUF012","DJ001"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","PLR","B"]
"apps/*/tests/**" = ["S","PLR","B"]
"config/settings/*" = ["S105"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["migrations", "tests"]
[[tool.mypy.overrides]]  # ADR 0003: untyped third-party packages only
module = ["celery.*", "environ.*", "allauth.*", "openpyxl.*", "reportlab.*", "oauth2_provider.*"]
ignore_missing_imports = true
[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
markers = ["ui: playwright UI smoke tests", "slow: slow tests"]
testpaths = ["tests", "apps"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py"]

# ---------- Architecture contracts (import-linter) ----------
[tool.importlinter]
root_packages = ["apps"]
include_external_packages = true

# Higher layers may import lower layers. Never the reverse. Siblings (|) are independent of each other.
[[tool.importlinter.contracts]]
name = "Module layering"
type = "layers"
layers = [
  "apps.reports | apps.ai_assistant | apps.automation | apps.integrations",
  "apps.pos | apps.payroll | apps.crm",
  "apps.sales | apps.purchasing | apps.hr",
  "apps.accounting | apps.inventory | apps.customers",
  "apps.catalog",
  "apps.approvals",
  "apps.billing | apps.tenancy | apps.accounts",
  "apps.core",
]
ignore_imports = [
  # api/ subpackages and tests may use core; nothing else is exempt without an ADR
  # ADR 0019: seed_demo command orchestrates demo data across all domain modules
  "apps.core.management.commands.seed_demo -> apps.accounts.models",
  "apps.core.management.commands.seed_demo -> apps.accounting.models",
  "apps.core.management.commands.seed_demo -> apps.accounting.services",
  "apps.core.management.commands.seed_demo -> apps.billing.services",
  "apps.core.management.commands.seed_demo -> apps.catalog.models",
  "apps.core.management.commands.seed_demo -> apps.crm.models",
  "apps.core.management.commands.seed_demo -> apps.crm.services",
  "apps.core.management.commands.seed_demo -> apps.customers.models",
  "apps.core.management.commands.seed_demo -> apps.customers.services",
  "apps.core.management.commands.seed_demo -> apps.hr.models",
  "apps.core.management.commands.seed_demo -> apps.hr.services",
  "apps.core.management.commands.seed_demo -> apps.inventory.services",
  "apps.core.management.commands.seed_demo -> apps.payroll.models",
  "apps.core.management.commands.seed_demo -> apps.payroll.services",
  "apps.core.management.commands.seed_demo -> apps.pos.models",
  "apps.core.management.commands.seed_demo -> apps.pos.services",
  "apps.core.management.commands.seed_demo -> apps.purchasing.models",
  "apps.core.management.commands.seed_demo -> apps.purchasing.services",
  "apps.core.management.commands.seed_demo -> apps.sales.models",
  "apps.core.management.commands.seed_demo -> apps.sales.services",
  "apps.core.management.commands.seed_demo -> apps.tenancy.models",
  "apps.core.management.commands.seed_demo -> apps.tenancy.services",
]

[[tool.importlinter.contracts]]
name = "Services/selectors never import views or serializers"
type = "forbidden"
source_modules = ["apps.*.services", "apps.*.selectors"]
forbidden_modules = ["apps.*.views", "apps.*.api", "rest_framework"]
allow_indirect_imports = true
